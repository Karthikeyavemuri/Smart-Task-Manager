# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:taskdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

# H2 Console (Disabled in prod by default if not set)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Server Config
server.port=${PORT:8080}

# Security Config
app.jwtSecret=${JWT_SECRET:defaultSecretKeyForLocalDev12345678901234567890}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Config
app.cors.allowedOrigins=${CORS_ORIGINS:http://localhost:5173}
